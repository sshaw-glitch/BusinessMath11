<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkbook Reconciliation Practice</title>
<style>
  :root{--ink:#1d2433;--muted:#5b6475;--line:#d5dae3;--soft:#f4f6f9;--accent:#1f5fae;--good:#1e7a46;--bad:#b3261e;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#eef1f5;line-height:1.4}
  .wrap{max-width:980px;margin:0 auto;padding:20px 14px 60px}
  header h1{margin:0 0 4px;font-size:1.6rem}
  header p{margin:0;color:var(--muted)}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:16px}
  .namebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .namebar input{flex:1;min-width:200px}
  .progress{display:flex;gap:6px;margin-top:12px}
  .dot{flex:1;height:8px;border-radius:4px;background:var(--line)}
  .dot.done{background:var(--good)} .dot.now{background:var(--accent)}
  h2{margin:0 0 6px;font-size:1.25rem} h3{margin:18px 0 8px;font-size:1.05rem}
  .instr{color:var(--muted);margin:0 0 6px}
  .tbl{width:100%;border-collapse:collapse;font-size:.92rem}
  .tbl th,.tbl td{border:1px solid var(--line);padding:5px 7px;text-align:left}
  .tbl th{background:var(--soft);font-weight:600}
  .tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}
  .tbl td.ck{text-align:center;width:42px}
  .tbl input[type=checkbox]{width:20px;height:20px;cursor:pointer}
  .scroll{overflow-x:auto}
  .bank{border:2px solid #2b3a55;border-radius:8px;padding:14px}
  .bankhead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;border-bottom:2px solid #2b3a55;padding-bottom:6px;margin-bottom:10px}
  .bankhead b{font-size:1.05rem;letter-spacing:.03em}
  .bankhead small{color:var(--muted)}
  .summary{width:auto;min-width:320px;margin-bottom:12px}
  .ws{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .ws .part{background:#2b3a55;color:#fff;padding:7px 10px;font-weight:600}
  .row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--line);flex-wrap:wrap}
  .row .lbl{flex:1;min-width:180px}
  .row.sub{padding-left:28px;background:#fafbfc}
  .row.total{font-weight:600;background:var(--soft)}
  .row.adj{font-weight:700;background:#e6eefa}
  .money{display:flex;align-items:center;gap:3px}
  input[type=text]{font:inherit;padding:6px 8px;border:1px solid #b9c1cd;border-radius:6px}
  input.amt{width:120px;text-align:right}
  input.desc{flex:1;min-width:160px}
  input.chk{width:80px}
  select{font:inherit;padding:6px;border-radius:6px;border:1px solid #b9c1cd}
  .btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
  button{font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:0;cursor:pointer;background:var(--accent);color:#fff}
  button.secondary{background:#fff;color:var(--accent);border:1px solid var(--accent)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .msg{margin-top:12px;padding:10px 12px;border-radius:8px;display:none;font-weight:600}
  .msg.bad{display:block;background:#fdecea;color:var(--bad);border:1px solid #f3c0bb}
  .msg.good{display:block;background:#e7f5ec;color:var(--good);border:1px solid #b6e0c4}
  .hidden{display:none}
  .sync{color:var(--muted);font-size:.88rem;margin-top:6px;min-height:1.2em}
  .finish{text-align:center;padding:30px 10px}
  .finish h2{font-size:1.6rem}
  .finish .btns{display:flex!important}
  @media print{body{background:#fff}.btns,.progress{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Checkbook Reconciliation Practice</h1>
    <p>5 problems. Complete each one correctly to unlock the next.</p>
  </header>

  <div class="card">
    <div class="namebar">
      <label for="studentName"><b>Your name:</b></label>
      <input type="text" id="studentName" placeholder="First and last name" autocomplete="off">
    </div>
    <div class="sync" id="sync"></div>
    <div class="progress" id="progress"></div>
  </div>

  <div id="problemArea"></div>

  <div class="card finish hidden" id="finish">
    <h2>🎉 All 5 problems complete!</h2>
    <p id="finishText"></p>
    <p><b>Last step:</b> click the button, then press <b>Submit</b> on the Google Form that opens.</p>
    <div class="btns" style="justify-content:center">
      <button onclick="openFilledForm()">📨 Submit my results</button>
      <button class="secondary" onclick="restart()">Start over</button>
    </div>
  </div>
</div>

const fmt = n => "$" + n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

// Lenient number reading: ignores $, commas, spaces, minus signs, parentheses.
function num(v){
  if (v==null) return null;
  const t = String(v).replace(/[\s$,()+\-]/g,"");
  if (t==="") return null;
  if (!/^\d*\.?\d*$/.test(t) || t===".") return NaN;
  return parseFloat(t);
}
function checkNo(v){ const t=String(v||"").replace(/\D/g,""); return t===""?null:t; }
const same = (a,b)=> a!=null && !isNaN(a) && Math.abs(a-b) < 0.005;

function sameMoneyList(entered, expected){
  const e = entered.slice(), x = expected.slice();
  if (e.some(v=>isNaN(v))) return false;
  if (e.length !== x.length) return false;
  for (const v of x){ const i = e.findIndex(w=>same(w,v)); if (i<0) return false; e.splice(i,1); }
  return true;
}

function renderProgress(){

  }
}

function lines(kind, n, withCheck){
  let h="";
  for (let i=0;i<n;i++){
    h += `<div class="row sub">${withCheck?`<span>Check #</span><input type="text" class="chk" data-f="${kind}No" inputmode="numeric">`:""}
      <input type="text" class="desc" data-f="${kind}Desc" placeholder="Description">
      <span class="money">$<input type="text" class="amt" data-f="${kind}" inputmode="decimal"></span></div>`;
  }
  return h;
}
function money(f, label, cls="row"){
  return `<div class="${cls}"><span class="lbl">${label}</span><span class="money">$<input type="text" class="amt" data-f="${f}" inputmode="decimal"></span></div>`;
}

function vals(f){ return $$(`[data-f="${f}"]`).map(e=>e.value); }
function one(f){ return num(vals(f)[0]); }

function check(){
  if (!(state.name||"").trim()){ $("#sync").textContent = "Type your name first, then check your answers."; nameBox.focus(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  const A = ANS[state.current];
  state.tries[state.current]++; save();
  let ok = true;

  // Check marks
  const checked = $$("[data-reg]").filter(c=>c.checked).map(c=>+c.dataset.reg).sort((a,b)=>a-b);
  if (checked.join(",") !== A.cleared.join(",")) ok = false;

  // Single boxes
  for (const f of ["bankEnd","ditT","osT","adjB","regEnd","adjR"]) if (!same(one(f), A[f])) ok = false;

  // Line-item lists (any order, blanks ignored)
  const listOf = f => vals(f).map(num).filter(v=>v!==null);
  if (!sameMoneyList(listOf("dit"), A.dit)) ok = false;
  if (!sameMoneyList(listOf("cr"), A.cr)) ok = false;
  if (!sameMoneyList(listOf("ch"), A.ch)) ok = false;

  // Outstanding checks: number + amount pairs, any order
  const nos = vals("osNo"), amts = vals("os");
  const pairs = [];
  for (let i=0;i<nos.length;i++){
    const n = checkNo(nos[i]), a = num(amts[i]);
    if (n===null && a===null) continue;
    pairs.push([n,a]);
  }
  if (pairs.length !== A.os.length) ok = false;
  else {
    const left = A.os.slice();
    for (const [n,a] of pairs){
      const i = left.findIndex(([en,ea])=> en===n && same(a,ea));
      if (i<0){ ok=false; break; } left.splice(i,1);
    }
  }

  if ($('[data-f="match"]').value !== "yes") ok = false;

  if (ok){ state.done = state.done || [0,0,0,0,0]; state.done[state.current] = 1; save(); }
  send();
  const msg = $("#msg");
  if (ok){
    msg.className = "msg good";
    msg.textContent = "✅ Correct! Your reconciliation balances.";
    $("#checkBtn").disabled = true;
    $$("input,select", $("#problemArea")).forEach(e=>e.disabled=true);
    const nb = $("#nextBtn"); nb.classList.remove("hidden");
    nb.textContent = state.current===4 ? "Finish →" : "Next problem →";
  } else {
    msg.className = "msg bad";
    msg.textContent = "❌ Not quite. Something doesn't match yet. Look over your work and try again.";
  }
}

function next(){ state.current++; save(); renderProblem(); }

function showFinish(){
  const f = $("#finish"); f.classList.remove("hidden");

  const who = (state.name||"").trim();

    ` reconciled all 5 checkbooks. Total checks used: ${total} (` +

}

}
function send(){
  const name=(state.name||"").trim(); if(!name) return;
  try{ localStorage.setItem(TKEY,activeSec); }catch(e){}
  const n=(state.done||[]).filter(Boolean).length;

  $("#sync").textContent="Sent to your teacher at "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+".";

// Posts through a hidden HTML form into a hidden frame (the classic way; no CORS needed).
function postToForm(params){
  let frame=document.getElementById("gfFrame");
  if(!frame){ frame=document.createElement("iframe"); frame.name="gfFrame"; frame.id="gfFrame"; frame.style.display="none"; document.body.appendChild(frame); }
  const f=document.createElement("form"); f.method="POST"; f.action=FORM_URL; f.target="gfFrame"; f.style.display="none";
  for(const [k,v] of params){ const i=document.createElement("input"); i.type="hidden"; i.name=k; i.value=v; f.appendChild(i); }
  document.body.appendChild(f); f.submit(); setTimeout(()=>f.remove(),2000);
}
// Opens the real Google Form already filled in, so the student can press Submit themselves.
function openFilledForm(){
  const name=(state.name||"").trim();
  const n=(state.done||[]).filter(Boolean).length;
  const q=new URLSearchParams({usp:"pp_url"});
  q.set(F_NAME,name); q.set(F_SCORE,"Checkbook Reconciliation: "+n+" of 5 problems complete | device "+DEV+" | "+Math.round(activeSec/60)+" min active"); q.set(F_ANS,answersString());
  window.open(FORM_URL.replace("formResponse","viewform")+"?"+q.toString(),"_blank");
}
